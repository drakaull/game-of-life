<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Game of Life</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Mobile browser bar in the page background colour of each theme (--color-bg). -->
    <meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1a17" media="(prefers-color-scheme: dark)" />
    <!-- Before the first paint, so the page never flashes the wrong theme. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <!-- Texts are in English here; src/ui/language.ts swaps every data-i18n* element. -->
    <canvas class="board" id="board" role="img"></canvas>
    <header class="topbar panel">
      <a class="back" href="https://leonard-fontaine.com/en">← Portfolio</a>
      <h1 class="title" data-i18n="title">Game of Life</h1>
    </header>
    <div class="corner panel">
      <button class="lang-button" id="lang-button" type="button" popovertarget="lang-menu">
        <span id="lang-flag"></span>
        <span class="lang-code" id="lang-code">EN</span>
        <svg class="chevron" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" /></svg>
      </button>
      <ul class="lang-menu panel" id="lang-menu" popover></ul>
      <button
        class="icon-button theme-button"
        id="theme-button"
        type="button"
        data-i18n-label="theme.dark"
        aria-pressed="false"
      >
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      </button>
    </div>
    <!-- Tooltips are plain spans shown by CSS on hover and keyboard focus. -->
    <div class="controls panel" role="group" data-i18n-label="controls.label">
      <button
        class="icon-button"
        id="previous"
        type="button"
        data-i18n-label="controls.previous"
        aria-keyshortcuts="J"
        aria-describedby="tip-previous"
      >
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 4h2v12H5zM16 4v12L8 10z" /></svg>
        <span class="tooltip" id="tip-previous" role="tooltip">
          <span data-i18n="controls.previous">Previous</span> <kbd>J</kbd>
        </span>
      </button>
      <button
        class="icon-button primary"
        id="play"
        type="button"
        aria-label="Play"
        aria-keyshortcuts="K Space"
        aria-describedby="tip-play"
      >
        <svg class="icon-play" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M6 4l10 6-10 6z" />
        </svg>
        <svg class="icon-pause" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M5 4h3.5v12H5zM11.5 4H15v12h-3.5z" />
        </svg>
        <span class="tooltip" id="tip-play" role="tooltip">
          <span data-i18n="controls.playPause">Play / pause</span> <kbd>K</kbd>
        </span>
      </button>
      <button
        class="icon-button"
        id="next"
        type="button"
        data-i18n-label="controls.next"
        aria-keyshortcuts="L"
        aria-describedby="tip-next"
      >
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13 4h2v12h-2zM4 4v12l8-6z" /></svg>
        <span class="tooltip" id="tip-next" role="tooltip">
          <span data-i18n="controls.next">Next</span> <kbd>L</kbd>
        </span>
      </button>
      <p class="counter">
        <span class="counter-label" data-i18n="controls.generationShort">Gen</span>
        <output id="generation" data-i18n-label="controls.generation">0</output>
      </p>
      <!-- On narrow screens the bar wraps here: timeline above, tools below. -->
      <span class="row-break" aria-hidden="true"></span>
      <label class="speed">
        <span class="visually-hidden" data-i18n="controls.speed">Speed</span>
        <input id="speed" type="range" min="0" max="100" value="41" />
        <output id="speed-value" for="speed">4/s</output>
      </label>
      <button
        class="icon-button"
        id="patterns-button"
        type="button"
        popovertarget="library"
        data-i18n-label="controls.patterns"
        aria-keyshortcuts="P"
        aria-describedby="tip-patterns"
      >
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M8 2h4v4H8zM13 7h4v4h-4zM3 12h4v4H3zM8 12h4v4H8zM13 12h4v4h-4z" />
        </svg>
        <span class="tooltip" id="tip-patterns" role="tooltip">
          <span data-i18n="controls.patterns">Patterns</span> <kbd>P</kbd>
        </span>
      </button>
      <button class="icon-button" id="random" type="button" data-i18n-label="controls.random">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path
            d="M4 3h12a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm2.5 2a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm7 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM10 8.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM6.5 12a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm7 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"
            fill-rule="evenodd"
          />
        </svg>
        <span class="tooltip" aria-hidden="true" data-i18n="controls.random">Random fill</span>
      </button>
      <button class="icon-button" id="clear" type="button" data-i18n-label="controls.clear">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M7 2h6v2h4v2H3V4h4zM4.5 7h11l-1 11h-9zM8 9v7h1.5V9zm2.5 0v7H12V9z" />
        </svg>
        <span class="tooltip" aria-hidden="true" data-i18n="controls.clear">Clear</span>
      </button>
      <button
        class="icon-button"
        id="recenter"
        type="button"
        data-i18n-label="controls.recenter"
        aria-keyshortcuts="0"
        aria-describedby="tip-recenter"
      >
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path
            d="M9 2h2v3.1A5 5 0 0 1 14.9 9H18v2h-3.1A5 5 0 0 1 11 14.9V18H9v-3.1A5 5 0 0 1 5.1 11H2V9h3.1A5 5 0 0 1 9 5.1zm1 5a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"
          />
        </svg>
        <span class="tooltip" id="tip-recenter" role="tooltip">
          <span data-i18n="controls.recenter">Recenter</span> <kbd>0</kbd>
        </span>
      </button>
      <button
        class="icon-button"
        id="help-button"
        type="button"
        popovertarget="help"
        data-i18n-label="controls.help"
        aria-keyshortcuts="?"
        aria-describedby="tip-help"
      >
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path
            d="M10 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16zm0 11.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zM10 5a3 3 0 0 0-3 3h2a1 1 0 1 1 1.6.8c-.9.6-1.6 1.3-1.6 2.7h2c0-.6.3-.9 1-1.4A3 3 0 0 0 10 5z"
          />
        </svg>
        <span class="tooltip" id="tip-help" role="tooltip">
          <span data-i18n="controls.help">How to play</span> <kbd>?</kbd>
        </span>
      </button>
    </div>
    <p class="notice panel" id="notice" role="status" hidden></p>
    <div class="help panel" id="help" popover aria-labelledby="help-title">
      <h2 class="help-title" id="help-title" data-i18n="controls.help">How to play</h2>
      <p data-i18n="help.intro"></p>
      <dl class="help-list for-pointer">
        <dt data-i18n="help.draw"></dt>
        <dd data-i18n="help.drawWhat"></dd>
        <dt data-i18n-html="help.pan"></dt>
        <dd data-i18n="help.move"></dd>
        <dt data-i18n-html="help.zoom"></dt>
        <dd data-i18n="help.zoomWhat"></dd>
        <dt data-i18n="help.arrows"></dt>
        <dd data-i18n="help.move"></dd>
        <dt data-i18n-html="help.playKeys"></dt>
        <dd data-i18n="controls.playPause"></dd>
        <dt><kbd>J</kbd> <kbd>L</kbd></dt>
        <dd data-i18n="help.stepWhat"></dd>
        <dt><kbd>0</kbd></dt>
        <dd data-i18n="controls.recenter"></dd>
        <dt><kbd>P</kbd></dt>
        <dd data-i18n="help.patternsPointer"></dd>
      </dl>
      <dl class="help-list for-touch">
        <dt data-i18n="help.touchDraw"></dt>
        <dd data-i18n="help.drawWhat"></dd>
        <dt data-i18n="help.fingers"></dt>
        <dd data-i18n="help.fingersWhat"></dd>
        <dt data-i18n="controls.previous"></dt>
        <dd data-i18n="help.previousWhat"></dd>
        <dt data-i18n="controls.patterns"></dt>
        <dd data-i18n="help.patternsTouch"></dd>
      </dl>
      <button
        class="help-close"
        type="button"
        popovertarget="help"
        popovertargetaction="hide"
        data-i18n="help.close"
      >
        Got it
      </button>
    </div>
    <div class="help library panel" id="library" popover aria-labelledby="library-title">
      <h2 class="help-title" id="library-title" data-i18n="controls.patterns">Patterns</h2>
      <div id="library-list"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
