<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Game of Life</title>
    <!-- Mobile browser bar in the page background colour of each theme (--color-bg). -->
    <meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1a17" media="(prefers-color-scheme: dark)" />
    <!-- Before the first paint, so the page never flashes the wrong theme. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <canvas class="board" id="board"></canvas>
    <header class="topbar panel">
      <a class="back" href="https://leonard-fontaine.com/en">← Portfolio</a>
      <h1 class="title">Game of Life</h1>
    </header>
    <div class="controls panel" role="group" aria-label="Simulation">
      <button
        class="icon-button"
        id="previous"
        type="button"
        aria-label="Previous"
        aria-keyshortcuts="J"
      >
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 4h2v12H5zM16 4v12L8 10z" /></svg>
      </button>
      <button
        class="icon-button primary"
        id="play"
        type="button"
        aria-label="Play"
        aria-keyshortcuts="K"
      >
        <svg class="icon-play" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M6 4l10 6-10 6z" />
        </svg>
        <svg class="icon-pause" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M5 4h3.5v12H5zM11.5 4H15v12h-3.5z" />
        </svg>
      </button>
      <button class="icon-button" id="next" type="button" aria-label="Next" aria-keyshortcuts="L">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13 4h2v12h-2zM4 4v12l8-6z" /></svg>
      </button>
      <p class="counter">
        <span class="counter-label">Gen</span>
        <output id="generation" aria-label="Generation">0</output>
      </p>
      <label class="speed">
        <span class="visually-hidden">Speed</span>
        <input id="speed" type="range" min="1" max="60" value="10" />
        <output id="speed-value" for="speed">10/s</output>
      </label>
      <button class="icon-button" id="random" type="button" aria-label="Random fill">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path
            d="M4 3h12a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm2.5 2a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm7 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM10 8.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM6.5 12a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm7 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"
            fill-rule="evenodd"
          />
        </svg>
      </button>
      <button class="icon-button" id="clear" type="button" aria-label="Clear">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M7 2h6v2h4v2H3V4h4zM4.5 7h11l-1 11h-9zM8 9v7h1.5V9zm2.5 0v7H12V9z" />
        </svg>
      </button>
    </div>
    <p class="notice panel" id="notice" role="status" hidden>
      Over 50,000 live cells: paused to keep the page responsive.
    </p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
